<svg width="960" height="260" viewBox="0 0 960 260" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Shared AI Memory MCP flow</title>
  <desc id="desc">AI clients connect to a self-hosted MCP server that stores small memories in Postgres and large artifacts in user-owned storage.</desc>
  <rect width="960" height="260" rx="18" fill="#101820"/>
  <path d="M64 202C163 110 276 82 403 118C520 152 584 141 693 76C767 32 836 31 896 58" stroke="#2DD4BF" stroke-width="3" opacity=".55"/>
  <path d="M64 216C179 151 292 143 404 192C507 237 624 218 741 134C792 98 844 84 896 92" stroke="#F59E0B" stroke-width="3" opacity=".55"/>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="64" y="58" fill="#F8FAFC" font-size="34" font-weight="700">Shared AI Memory MCP</text>
    <text x="64" y="88" fill="#CBD5E1" font-size="16">Portable memory and artifact recall for MCP-compatible AI clients.</text>
    <g transform="translate(64 124)">
      <rect width="196" height="76" rx="10" fill="#172A36" stroke="#334155"/>
      <text x="18" y="32" fill="#F8FAFC" font-size="15" font-weight="700">AI clients</text>
      <text x="18" y="56" fill="#94A3B8" font-size="13">Claude, agents, tools</text>
    </g>
    <path d="M278 162H356" stroke="#94A3B8" stroke-width="2"/>
    <path d="M348 154L356 162L348 170" stroke="#94A3B8" stroke-width="2"/>
    <g transform="translate(374 106)">
      <rect width="212" height="112" rx="10" fill="#12313A" stroke="#2DD4BF"/>
      <text x="18" y="34" fill="#F8FAFC" font-size="15" font-weight="700">Self-hosted server</text>
      <text x="18" y="60" fill="#A7F3D0" font-size="13">/mcp + protected REST</text>
      <text x="18" y="84" fill="#CBD5E1" font-size="13">Bearer token auth</text>
    </g>
    <path d="M604 138H682" stroke="#94A3B8" stroke-width="2"/>
    <path d="M604 186H682" stroke="#94A3B8" stroke-width="2"/>
    <path d="M674 130L682 138L674 146" stroke="#94A3B8" stroke-width="2"/>
    <path d="M674 178L682 186L674 194" stroke="#94A3B8" stroke-width="2"/>
    <g transform="translate(700 86)">
      <rect width="196" height="76" rx="10" fill="#1E293B" stroke="#475569"/>
      <text x="18" y="32" fill="#F8FAFC" font-size="15" font-weight="700">Postgres memory</text>
      <text x="18" y="56" fill="#94A3B8" font-size="13">Small durable facts</text>
    </g>
    <g transform="translate(700 176)">
      <rect width="196" height="56" rx="10" fill="#2B2214" stroke="#F59E0B"/>
      <text x="18" y="24" fill="#F8FAFC" font-size="15" font-weight="700">User-owned storage</text>
      <text x="18" y="44" fill="#FED7AA" font-size="13">Files, logs, datasets</text>
    </g>
  </g>
</svg>
